<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Paswan Dev</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                -45deg,
                #06142e,
                #075985,
                #164e63,
                #312e81
            );

            background-size: 400% 400%;
            animation: moveGradient 12s ease infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .weather-app {
            width: min(92%, 500px);
            padding: 30px;

            text-align: center;

            background: rgba(255,255,255,.10);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 25px;

            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top h1 {
            margin: 0;
            font-size: 25px;
        }

        .home {
            color: white;
            text-decoration: none;

            padding: 8px 12px;
            border-radius: 20px;

            border: 1px solid rgba(255,255,255,.3);
        }

        .search {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        input {
            flex: 1;
            min-width: 0;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: rgba(0,0,0,.25);
            color: white;

            outline: none;
            font-size: 16px;
        }

        input::placeholder {
            color: #cbd4ff;
        }

        button {
            border: none;
            border-radius: 12px;

            padding: 12px 18px;

            background: linear-gradient(
                90deg,
                #00aaff,
                #7c3aed
            );

            color: white;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #result {
            margin-top: 30px;
        }

        .weather-icon {
            font-size: 70px;
        }

        .temperature {
            font-size: 55px;
            font-weight: bold;
            margin: 10px 0;
        }

        .city {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .info {
            color: #dce3ff;
            line-height: 1.7;
        }

        .error {
            color: #ffd4d4;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .weather-app {
                padding: 22px;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                width: 100%;
            }

            .temperature {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

<div class="weather-app">

    <div class="top">
        <h1>🌦️ Weather App</h1>

        <a href="index.html" class="home">
            🏠 Home
        </a>
    </div>

    <div class="search">

        <input
            id="cityInput"
            type="text"
            placeholder="Enter city name..."
        >

        <button onclick="getWeather()">
            🔍 Search
        </button>

    </div>

    <div id="result"></div>

</div>

<script>

async function getWeather() {

    const city =
        document.getElementById("cityInput").value.trim();

    const result =
        document.getElementById("result");

    if (!city) {
        result.innerHTML =
            '<p class="error">Please enter a city name.</p>';
        return;
    }

    result.innerHTML =
        "<p>⏳ Loading weather...</p>";

    try {

        const geoResponse =
            await fetch(
                "https://geocoding-api.open-meteo.com/v1/search?name="
                + encodeURIComponent(city)
                + "&count=1&language=en&format=json"
            );

        const geoData =
            await geoResponse.json();

        if (!geoData.results) {
            throw new Error("City not found");
        }

        const place =
            geoData.results[0];

        const weatherResponse =
            await fetch(
                "https://api.open-meteo.com/v1/forecast"
                + "?latitude=" + place.latitude
                + "&longitude=" + place.longitude
                + "&current=temperature_2m,weather_code,wind_speed_10m"
                + "&timezone=auto"
            );

        const weather =
            await weatherResponse.json();

        const current =
            weather.current;

        const icon =
            getWeatherIcon(current.weather_code);

        result.innerHTML = `
            <div class="weather-icon">
                ${icon}
            </div>

            <div class="city">
                ${place.name}
            </div>

            <div class="temperature">
                ${Math.round(current.temperature_2m)}°C
            </div>

            <div class="info">
                🌬️ Wind:
                ${current.wind_speed_10m} km/h
                <br>
                🕒 Local time:
                ${current.time.replace("T", " ")}
            </div>
        `;

    } catch (error) {

        result.innerHTML =
            '<p class="error">❌ City not found or weather data unavailable.</p>';

    }
}


function getWeatherIcon(code) {

    if (code === 0) return "☀️";

    if (code <= 3) return "🌤️";

    if (code <= 48) return "🌫️";

    if (code <= 67) return "🌧️";

    if (code <= 77) return "❄️";

    if (code <= 82) return "🌦️";

    return "⛈️";
}


document
    .getElementById("cityInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            getWeather();
        }

    });

</script>

</body>
</html>
