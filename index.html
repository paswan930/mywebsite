<!DOCTYPE html>
<html>
<head>
    <title>My Website 🚀</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            background: #ffcc00;
            color: #222;
            cursor: pointer;
        }

        button:hover {
            background: #ff9900;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Website 🚀</h1>

        <p>This website was created using Termux.</p>

        <button onclick="alert('Hello! 👋 Welcome to my website!')">
            Click Me
        </button>
    </div>

</body>
</html>
